<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#43A047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A5D6A7;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:0.3" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
    <!-- Inner glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Subtle decorative circle top-right -->
  <circle cx="780" cy="240" r="180" fill="url(#accentGrad)" opacity="0.4"/>

  <!-- Subtle decorative circle bottom-left -->
  <circle cx="240" cy="780" r="140" fill="url(#accentGrad)" opacity="0.3"/>

  <!-- Central Shield/Badge shape -->
  <path d="M512 160 C512 160, 720 200, 760 220 C760 220, 780 440, 760 560 C740 680, 620 800, 512 864 C404 800, 284 680, 264 560 C244 440, 264 220, 264 220 C304 200, 512 160, 512 160Z"
        fill="white" opacity="0.15" filter="url(#shadow)"/>

  <!-- Heartbeat / Pulse Line -->
  <polyline points="200,530 340,530 380,530 420,440 460,620 500,380 540,660 580,470 620,530 660,530 824,530"
            fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)" opacity="0.95"/>

  <!-- Dumbbell icon top center -->
  <!-- Left weight -->
  <rect x="420" y="260" width="36" height="80" rx="8" fill="white" opacity="0.95"/>
  <rect x="434" y="240" width="8" height="120" rx="4" fill="white" opacity="0.95"/>
  <!-- Bar -->
  <rect x="456" y="293" width="112" height="14" rx="7" fill="white" opacity="0.95"/>
  <!-- Right weight -->
  <rect x="568" y="260" width="36" height="80" rx="8" fill="white" opacity="0.95"/>
  <rect x="582" y="240" width="8" height="120" rx="4" fill="white" opacity="0.95"/>

  <!-- "FT" Text at bottom -->
  <text x="512" y="780" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="160" font-weight="900" fill="white" opacity="0.95" letter-spacing="12">FT</text>

  <!-- Small underline accent -->
  <rect x="412" y="800" width="200" height="6" rx="3" fill="#A5D6A7" opacity="0.8"/>
</svg>
